<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
<title id="title">OEAL 项目架构：实验、仿真、设计与可验证交付</title><desc id="desc">统一 IR 和执行器连接原生、motulator、MuJoCo 模型。原始信号流由独立验收器重算，形成受保护的优化闭环和可追溯报告。并列验证包括数学参考、PI SIL 与 ARM QEMU。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61758d"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a59b4"/></marker></defs>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;fill:#20344b}.title{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#60758d}.label{font-size:14px;fill:#60758d}.heading{font-size:22px;font-weight:700}.body{font-size:17px}.code{font-size:14px;fill:#60758d}.flow{fill:none;stroke:#61758d;stroke-width:2;marker-end:url(#arrow)}.fb{fill:none;stroke:#8a59b4;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#feedback)}</style>
<rect width="1440" height="1320" rx="22" fill="#f3f6fb"/><text x="50" y="61" class="title">OEAL · 开放工程仿真与受保护设计</text><text x="50" y="92" class="sub">当前已实现架构 · 单进程 Python 模块与离线实验流水线 · 2026-10-23</text>
<rect x="50" y="150" width="420" height="145" rx="17" fill="white" stroke="#d7e1ed"/><rect x="50" y="168" width="5" height="28" rx="2" fill="#087f82"/><text x="72" y="187" class="heading">01  使用入口</text><text x="72" y="220" class="body">用户目标 / JSON 工况</text><text x="72" y="246" class="body">CLI 与 Python API 共用运行器</text><text x="72" y="278" class="code">cli.py · experiments.py</text><rect x="510" y="150" width="420" height="145" rx="17" fill="white" stroke="#d7e1ed"/><rect x="510" y="168" width="5" height="28" rx="2" fill="#8a59b4"/><text x="532" y="187" class="heading">02  受保护的设计循环</text><text x="532" y="220" class="body">python-control / Optuna / SALib</text><text x="532" y="246" class="body">只调允许增益，目标与预算固定</text><text x="532" y="278" class="code">agent_tools.py · study_tools.py</text><rect x="970" y="150" width="420" height="145" rx="17" fill="white" stroke="#d7e1ed"/><rect x="970" y="168" width="5" height="28" rx="2" fill="#3b62c9"/><text x="992" y="187" class="heading">并列验证与固件仿真</text><text x="992" y="220" class="body">解析参考 / DOP853 / RC FMI</text><text x="992" y="246" class="body">PI C → 主机 SIL → ARM / QEMU</text><text x="992" y="278" class="code">benchmarks/ · firmware/</text><rect x="50" y="365" width="1340" height="125" rx="17" fill="white" stroke="#d7e1ed"/><rect x="50" y="383" width="5" height="28" rx="2" fill="#087f82"/><text x="72" y="402" class="heading">03  统一契约、版本分派与固定模型注册</text><text x="72" y="435" class="body">IR 0.2：单位 / 能力 / 时钟 / 预算 / 资产哈希；IR 0.1 保持兼容，PathSim 仅旧版开环路径</text><text x="72" y="473" class="code">ir.py · studies.py · schemas/ir-0.1.json · schemas/ir-0.2.json · asset-lock.json</text><rect x="50" y="560" width="420" height="175" rx="17" fill="white" stroke="#d7e1ed"/><rect x="50" y="578" width="5" height="28" rx="2" fill="#087f82"/><text x="72" y="597" class="heading">原生数值后端</text><text x="72" y="630" class="body">PMSM RK4 / 20 kHz FOC</text><text x="72" y="656" class="body">Clarke / Park / PI / 抗饱和</text><text x="72" y="682" class="body">九状态电气—关节—三节点热</text><text x="72" y="718" class="code">models/ · foc.py · multiphysics.py</text><rect x="510" y="560" width="420" height="175" rx="17" fill="white" stroke="#d7e1ed"/><rect x="510" y="578" width="5" height="28" rx="2" fill="#087f82"/><text x="532" y="597" class="heading">motulator 开源电驱</text><text x="532" y="630" class="body">PWM / 死区 / 压降 / 母线</text><text x="532" y="656" class="body">非线性磁图 / 传感器</text><text x="532" y="682" class="body">六节点热网络与铜阻反馈</text><text x="532" y="718" class="code">backends/motulator.py · refined_thermal.py</text><rect x="970" y="560" width="420" height="175" rx="17" fill="white" stroke="#d7e1ed"/><rect x="970" y="578" width="5" height="28" rx="2" fill="#087f82"/><text x="992" y="597" class="heading">MuJoCo + Menagerie</text><text x="992" y="630" class="body">UR5e：一个研究电驱关节</text><text x="992" y="656" class="body">50:1 弹性传动 / 可选齿隙</text><text x="992" y="682" class="body">其余关节采用上游位置保持</text><text x="992" y="718" class="code">backends/robot.py</text><rect x="50" y="840" width="750" height="150" rx="17" fill="white" stroke="#d7e1ed"/><rect x="50" y="858" width="5" height="28" rx="2" fill="#087f82"/><text x="72" y="877" class="heading">04  统一结果与原始信号流</text><text x="72" y="910" class="body">control / joint / waveforms / gates：各自的时间语义</text><text x="72" y="936" class="body">信号单位、来源、输入哈希与原始流哈希</text><text x="72" y="973" class="code">SimulationResult · CSV + streams.json</text><rect x="850" y="840" width="540" height="150" rx="17" fill="white" stroke="#d7e1ed"/><rect x="850" y="858" width="5" height="28" rx="2" fill="#8a59b4"/><text x="872" y="877" class="heading">05  独立重算验收</text><text x="872" y="910" class="body">原始轨迹 → 固定位置 / 电流 / 转矩指标</text><text x="872" y="936" class="body">不信任自报 metrics / passed</text><text x="872" y="973" class="code">studies.recompute · verify_change</text><rect x="50" y="1080" width="900" height="145" rx="17" fill="white" stroke="#d7e1ed"/><rect x="50" y="1098" width="5" height="28" rx="2" fill="#087f82"/><text x="72" y="1117" class="heading">06  内容寻址证据与现代交互报告</text><text x="72" y="1150" class="body">原始轨迹、失败记录、manifest 与 CI artifacts</text><text x="72" y="1176" class="body">离线 HTML / PDF / PNG / SVG / CSV；系统机制与组件状态回放</text><text x="72" y="1208" class="code">实验账本 · reports/ · build_p6_report.py · Chrome UI 验证</text><rect x="990" y="1080" width="400" height="145" rx="17" fill="white" stroke="#d7e1ed"/><rect x="990" y="1098" width="5" height="28" rx="2" fill="#b16a1b"/><text x="1012" y="1117" class="heading">当前边界</text><text x="1012" y="1150" class="body">离线工具闭环；单关节研究</text><text x="1012" y="1176" class="body">能量未完全闭合；真机由用户负责</text><text x="1012" y="1208" class="code">完整关节 FMI / 完整 FOC 固件待扩展</text><path d="M260 295V365" class="flow"/><path d="M720 295V365" class="flow"/><path d="M1180 295V330H1340V365" class="fb"/><path d="M260 490V560" class="flow"/><path d="M720 490V560" class="flow"/><path d="M1180 490V560" class="flow"/><path d="M930 635H970" class="flow"/><path d="M970 665H930" class="flow"/><path d="M260 735V840" class="flow"/><path d="M720 735V840" class="flow"/><path d="M1180 735V787H630V840" class="flow"/><path d="M800 915H850" class="flow"/><path d="M390 990V1080" class="flow"/><path d="M1110 990V1030H740V1080" class="flow"/><path d="M1390 915H1420V120H720V150" class="fb"/><text x="906" y="538" class="label">200 μs 宏步转矩交换 / 保持</text><text x="1180" y="110" class="label">验收反馈 → 下一次提议</text><text x="55" y="1281" class="label">实线：实验 / 模型 / 证据流　　虚线：验证与设计反馈　　各后端为可选实验路径，不表示所有模型同时运行。</text></svg>