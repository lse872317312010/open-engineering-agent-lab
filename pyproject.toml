[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-engineering-agent-lab"
version = "0.1.0"
description = "Open Python research lab for agent-assisted motor-control engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "pytest>=8,<9"]
fmi = ["FMPy==0.3.26"]

[project.scripts]
oeal = "oeal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.setuptools.package-data]
oeal = ["schemas/*.json"]
