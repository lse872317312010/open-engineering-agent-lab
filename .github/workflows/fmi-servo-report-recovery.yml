name: FMI servo report recovery from audited physics
on:
  push:
    branches: [codex/fmi-servo]
    paths: ['.github/workflows/fmi-servo-report-recovery.yml']
permissions:
  contents: read
  actions: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fmi-servo-raw-evidence
          run-id: 40429838247
          github-token: ${{ github.token }}
          path: outputs/fmi-servo
      - name: Install pinned report and audit environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Verify original raw file hashes and re-audit frozen cases
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from oeal.ir import document_hash, validate_document
          from oeal.studies import recompute
          root = Path("outputs/fmi-servo")
          hashes = json.loads((root / "manifest.json").read_text())
          for path in root.rglob("*"):
              if path.is_file() and path.name != "manifest.json":
                  key = "fmi-servo/" + str(path.relative_to(root))
                  assert key in hashes, key
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == hashes[key], key
          data = json.loads((root / "validation.json").read_text())
          assert data["passed"] and len(data["cases"]) == 6
          assert data["position_step_difference_rad"] <= 1e-5
          for case in data["cases"]:
              doc = json.loads((root / case["id"] / "input.json").read_text())
              result = json.loads((root / case["id"] / "result.json").read_text())
              validate_document(doc)
              validate_document(result)
              assert result["experiment_sha256"] == document_hash(doc)
              assert result["raw_sha256"] == case["raw_sha256"]
              metrics, numeric, passed = recompute(doc, result)
              assert numeric and passed == case["expected_passed"]
              assert metrics == case["metrics"]
          print("recovered-raw-audit: six cases and file hashes passed")
          PY
      - name: Render fixed four-figure report and exercise actual Chrome
        run: |
          ruff check .
          python benchmarks/build_fmi_servo_report.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = dict(physics_run=40429838247,
                          physics_head="aec3e58ef873692e2909dcda139ad3384632da83",
                          report_commit=os.environ["GITHUB_SHA"],
                          change="UI case count assertion five to six; no model/data/gate change")
          Path("outputs/fmi-servo-report/recovery-provenance.json").write_text(
              json.dumps(evidence, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmi-servo-report-verified
          path: outputs/fmi-servo-report/
          if-no-files-found: error
