name: P7 conservative RT0 flux reconstruction
on:
  push:
    branches: [main, codex/p7-conservative-flux]
    paths: ['benchmarks/p7_flux*', 'benchmarks/validate_p7_conservative*', 'benchmarks/build_p7_conservative*', 'reports/p7-conservative.html', 'tests/test_p7_conservative*', '.github/workflows/p7-conservative.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
concurrency:
  group: p7-conservative-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manufactured-fe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install separate FE environment and retain wheel provenance
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
          mkdir -p outputs/p7-conservative
          python -m pip install --report outputs/p7-conservative/pip-install.json -r benchmarks/p7-fea-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint, analytic reference and complete pytest regression
        run: |
          ruff check .
          python -m pytest
      - name: Real Gmsh meshes, FE solve, independent convergence and heat gates
        run: |
          python benchmarks/p7_fea_baseline.py
          python benchmarks/p7_layered.py
          python benchmarks/validate_p7_conservative_flux.py
      - name: Offline field report and browser validation
        run: python benchmarks/build_p7_conservative_report.py
      - name: Retain environment and complete evidence manifest
        if: always()
        run: |
          mkdir -p outputs/p7-fea-baseline
          python -m pip freeze > outputs/p7-conservative/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          files = {}
          for folder in ("p7-fea-baseline", "p7-layered", "p7-conservative", "p7-conservative-report"):
              for p in sorted((root / folder).rglob("*")):
                  if p.is_file():
                      files[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          (root / "p7-conservative/manifest.json").write_text(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-conservative-report
          path: outputs/p7-conservative-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-conservative-raw-evidence
          path: |
            outputs/p7-fea-baseline/
            outputs/p7-layered/
            outputs/p7-conservative/
          if-no-files-found: error
      - name: Enforce actual FE and UI gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("p7-fea-baseline/validation.json", "p7-layered/validation.json",
                       "p7-conservative/validation.json", "p7-conservative-report/ui-validation.json"):
              assert json.loads((Path("outputs") / name).read_text())["passed"], name
          PY
