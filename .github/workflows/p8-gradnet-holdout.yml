name: P8 GradNet spatial holdout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/p8_gradnet_holdout.py"
      - "benchmarks/import_magnetic_points.py"
      - ".github/workflows/p8-gradnet-holdout.yml"

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aalto-Electric-Drives/motulator-gradnet
          ref: 940d3b2daf3abd3ecca157f93cf4cc5363f5bb80
          path: upstream-gradnet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify sample identity
        run: |
          test "$(git -C upstream-gradnet rev-parse HEAD)" = 940d3b2daf3abd3ecca157f93cf4cc5363f5bb80
          test "$(git hash-object upstream-gradnet/examples/datasets/baldor_meas.npz)" = 13205be7fd92362f6a3ed0178f7c1652f942fd64
      - name: Install upstream dependencies
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "motulator==0.25.0" ./upstream-gradnet
      - name: Run fixed spatial holdout
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/p8-gradnet-holdout
          python -m pip freeze > outputs/p8-gradnet-holdout/versions.txt
          python benchmarks/p8_gradnet_holdout.py 2>&1 | tee outputs/p8-gradnet-holdout/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-gradnet-spatial-holdout
          path: outputs/p8-gradnet-holdout/
          if-no-files-found: warn
