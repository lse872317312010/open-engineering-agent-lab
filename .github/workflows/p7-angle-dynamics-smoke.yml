name: P7 angle-dependent dynamics synthetic smoke
on:
  push:
    branches: [codex/p7-loaded-angle-dynamics]
    paths: ['benchmarks/p7_angle_flux.py', 'benchmarks/p7_angle_dynamics_simulation.py', 'benchmarks/p7_angle_dynamics_smoke.py', '.github/workflows/p7-angle-dynamics-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3
      - run: python benchmarks/p7_angle_dynamics_smoke.py
