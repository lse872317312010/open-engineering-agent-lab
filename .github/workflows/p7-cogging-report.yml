name: P7 cogging mechanical report
on:
  push:
    branches: [codex/p7-cogging-coenergy]
    paths: ['benchmarks/p7_cogging_model.py', 'benchmarks/p7_native_coenergy_report.py', 'benchmarks/p7_native_coenergy_negative.py', 'benchmarks/p7_cogging_extract.py', 'benchmarks/p7_cogging_evaluate.py', 'benchmarks/p7_cogging_simulation.py', 'benchmarks/p7_cogging_report.py', 'benchmarks/p7_cogging_source_negative.py', 'tests/test_p7_cogging_model.py', 'reports/p7-cogging.html', '.github/workflows/p7-cogging-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      NATIVE_COMMIT: 533cd4ea61da1ec2c5f809ddb54adec4a1027a7d
      NATIVE_RUN: "42011534208"
    steps:
      - name: Verify complete native coenergy source
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: 42011534208
            });
            if (result.data.status !== "completed" || result.data.conclusion !== "success") {
              throw new Error("Native coenergy source not complete and successful");
            }
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.7 playwright==1.55.0
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from pathlib import Path; Path('outputs').mkdir(exist_ok=True)"
      - run: gh release download snapshot-2026-11-05 --pattern open-engineering-report.zip --dir outputs
      - run: python benchmarks/p7_cogging_extract.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-coenergy-*
          path: outputs/native-results
          run-id: 42011534208
          github-token: ${{ github.token }}
      - name: Verify controller source
        run: |
          git fetch origin 3a2977f5512401c2e5775b15660ffae41d435c5b --depth=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 3a2977f5512401c2e5775b15660ffae41d435c5b HEAD -- src/oeal/current_control.py src/oeal/foc.py src/oeal/transforms.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ruff check .
      - run: python -m pytest
      - run: python benchmarks/p7_cogging_evaluate.py
      - run: python benchmarks/p7_cogging_source_negative.py
      - run: python benchmarks/p7_native_coenergy_report.py
      - run: python benchmarks/p7_native_coenergy_negative.py
      - run: python benchmarks/p7_cogging_simulation.py
      - run: python benchmarks/p7_cogging_report.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-cogging-report
          path: outputs/p7-cogging-report/
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        run: python -c "import json; from pathlib import Path; p=Path('outputs/p7-cogging-report'); assert json.loads((p/'fields.json').read_text())['evidence_passed']; assert json.loads((p/'ui-validation.json').read_text())['passed']"
