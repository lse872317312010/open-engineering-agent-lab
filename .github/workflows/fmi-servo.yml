name: Configurable FMI plant and servo evidence
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'firmware/fmi/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-servo.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'firmware/fmi/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-servo.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
jobs:
  servo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint and independent references
        run: |
          ruff check .
          python -m pytest
      - name: Validate configurable plant before runtime whitelist registration
        run: python benchmarks/validate_configurable_fmi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configurable-fmi-evidence
          path: outputs/configurable-fmi/
          if-no-files-found: error
