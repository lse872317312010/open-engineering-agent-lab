name: Configurable FMI plant and servo evidence
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'firmware/fmi/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-servo.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'firmware/fmi/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-servo.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
jobs:
  servo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint and independent references
        run: |
          ruff check .
          python -m pytest
      - name: Validate configurable plant before runtime whitelist registration
        run: python benchmarks/validate_configurable_fmi.py
      - name: Actual old and new FMI integration regression
        env:
          OEAL_FMI_ASSET_ROOT: outputs/joint-fmi
          OEAL_SERVO_ASSET_ROOT: outputs/configurable-fmi
        run: python -m pytest
      - name: Fixed position cases and independent PD PI and DOP853
        run: python benchmarks/validate_fmi_servo.py
      - name: Four-figure mechanism parameter and state report in real Chrome
        run: python benchmarks/build_fmi_servo_report.py
      - name: Preserve environment and hashes
        if: always()
        run: |
          mkdir -p outputs/fmi-servo
          python -m pip freeze > outputs/fmi-servo/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          data = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob("*")) if p.is_file()
                  and "package" not in p.parts and "runtime" not in p.parts}
          (root / "fmi-servo/manifest.json").write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmi-servo-report
          path: outputs/fmi-servo-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmi-servo-raw-evidence
          path: outputs/fmi-servo/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configurable-fmi-evidence
          path: outputs/configurable-fmi/
          if-no-files-found: error
  tidy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only merged configurable FMI branch
        run: |
          python - <<'PY'
          import subprocess
          ref = "refs/heads/codex/fmi-servo"
          found = subprocess.check_output(["git", "ls-remote", "--heads", "origin", ref], text=True).strip()
          if found:
              sha = found.split()[0]
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha, "origin", ":" + ref], check=True)
          PY
