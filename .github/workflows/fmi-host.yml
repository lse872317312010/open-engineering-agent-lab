name: FMI unified host closed-loop evidence
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-host.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'benchmarks/**', 'reports/**', '.github/workflows/fmi-host.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FMI reference and report environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Build existing pinned FMU without changing its C model
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "benchmarks")
          from validate_joint_fmi import build
          build()
          PY
      - name: Lint and regression including real FMI integration
        env:
          OEAL_FMI_ASSET_ROOT: outputs/joint-fmi
        run: |
          ruff check .
          python -m pytest
      - name: Shared IR CLI protected Agent and independent DOP853 host references
        run: python benchmarks/validate_fmi_host.py
      - name: Report actual success and expected failure in real Chrome
        run: python benchmarks/build_fmi_host_report.py
      - name: Preserve environment and hashes
        if: always()
        run: |
          mkdir -p outputs/fmi-host
          python -m pip freeze > outputs/fmi-host/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          manifest = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.rglob("*")) if p.is_file()
                      and "runtime" not in p.parts and "package" not in p.parts}
          (root / "fmi-host/manifest.json").write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmi-host-report
          path: outputs/fmi-host-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmi-host-raw-evidence
          path: outputs/fmi-host/
          if-no-files-found: error
  tidy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only merged FMI host branch
        run: |
          python - <<'PY'
          import subprocess
          ref = "refs/heads/codex/fmi-host"
          found = subprocess.check_output(["git", "ls-remote", "--heads", "origin", ref], text=True).strip()
          if found:
              sha = found.split()[0]
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha, "origin", ":" + ref], check=True)
          PY
