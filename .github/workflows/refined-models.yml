name: Open-model refinement evidence
on:
  push:
    branches: [main, codex/open-model-refinement]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refined:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      MUJOCO_GL: osmesa
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/mujoco_menagerie
          ref: cda5236f98383f6fbaa4820c6b18dba892cd087f
          path: vendor/menagerie
          sparse-checkout: universal_robots_ur5e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned open-model environment
        run: |
          python -m pip install -r benchmarks/refined-requirements.txt
          python -m pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libosmesa6 fonts-noto-cjk
      - name: Lint and independent model regression
        run: |
          ruff check . --exclude vendor
          python -m pytest
      - name: Execute open-model references and coupled cases
        run: python benchmarks/validate_open_models.py
      - name: Build extended report
        run: |
          python benchmarks/validate_p6.py
          python benchmarks/validate_fmi_thermal.py
          python benchmarks/build_p6_report.py
      - name: Verify interactive report
        run: python benchmarks/validate_report_ui.py
      - name: Package report and source evidence
        run: |
          python -c "import shutil; shutil.make_archive('outputs/p6-report', 'zip', 'outputs/report')"
          python benchmarks/evidence_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-open-models-report-and-evidence
          path: outputs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p6-open-models-report
          path: outputs/report/
          if-no-files-found: error
