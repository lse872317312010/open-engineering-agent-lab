name: P7 multi-period mechanical evidence
on:
  pull_request:
    paths:
      - 'benchmarks/p7_period_crossing.py'
      - 'benchmarks/p7_cogging_model.py'
      - 'benchmarks/p7_cogging_simulation.py'
      - 'tests/test_p7_cogging_model.py'
      - 'src/oeal/heat_sources.py'
      - 'tests/test_heat_sources.py'
      - 'benchmarks/p7_winding_heat.py'
      - 'benchmarks/p7_stator_*.py'
      - 'benchmarks/p7_electric_thermal_replay.py'
      - 'benchmarks/p7_temperature_feedback.py'
      - 'benchmarks/p7_feedback_endurance.py'
      - 'benchmarks/p7_foc_loss_map.py'
      - 'benchmarks/p7_speed_loss_map.py'
      - 'benchmarks/p7_speed_ramp.py'
      - 'src/oeal/speed_loss_map.py'
      - 'tests/test_speed_loss_map.py'
      - 'tests/test_p7_speed_ramp.py'
      - 'docs/p7-speed-loss-map-contract.md'
      - 'benchmarks/p7_locked_electrical.py'
      - 'src/oeal/foc_loss_map.py'
      - 'tests/test_foc_loss_map.py'
      - 'tests/test_p7_locked_electrical.py'
      - 'docs/p7-foc-loss-map-contract.md'
      - 'src/oeal/current_envelope.py'
      - 'tests/test_current_envelope.py'
      - 'tests/test_p7_feedback_endurance.py'
      - 'docs/p7-feedback-endurance-contract.md'
      - 'src/oeal/stator_feedback.py'
      - 'tests/test_stator_feedback.py'
      - 'docs/p7-temperature-feedback-contract.md'
      - 'benchmarks/build_p7_stator_figure.py'
      - 'benchmarks/p7-stator-requirements.txt'
      - 'tests/test_p7_stator_thermal.py'
      - 'tests/test_p7_stator_fast_rom.py'
      - 'docs/p7-stator-fast-rom-contract.md'
      - 'tests/test_p7_electric_thermal_replay.py'
      - 'src/oeal/stator_rom.py'
      - 'tests/test_stator_rom.py'
      - 'benchmarks/build_p7_stator_rom_figure.py'
      - '.github/workflows/p7-period-crossing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r benchmarks/p7-stator-requirements.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from pathlib import Path; Path('outputs').mkdir(exist_ok=True)"
      - run: gh release download snapshot-2026-11-05 --pattern open-engineering-report.zip --dir outputs
      - run: python benchmarks/p7_cogging_extract.py
      - run: ruff check .
      - run: python -m pytest
      - run: python benchmarks/p7_cogging_evaluate.py
      - run: python benchmarks/p7_cogging_simulation.py
      - run: python -c "import json; assert json.load(open('outputs/p7-cogging-report/dynamics.json'))['passed']"
      - run: python benchmarks/p7_period_crossing.py
      - run: python benchmarks/p7_winding_heat.py
      - run: python benchmarks/p7_stator_thermal.py
      - run: python benchmarks/build_p7_stator_figure.py
      - run: python benchmarks/p7_stator_rom_study.py train
      - run: python benchmarks/p7_stator_rom_study.py validate
      - run: python benchmarks/build_p7_stator_rom_figure.py
      - run: python benchmarks/p7_electric_thermal_replay.py
      - run: python benchmarks/p7_stator_fast_rom.py train
      - run: python benchmarks/p7_stator_fast_rom.py validate
      - run: python benchmarks/p7_temperature_feedback.py
      - run: python benchmarks/p7_feedback_endurance.py
      - run: python benchmarks/p7_foc_loss_map.py train
      - run: python benchmarks/p7_foc_loss_map.py validate
      - run: python benchmarks/p7_speed_loss_map.py train
      - run: python benchmarks/p7_speed_loss_map.py validate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-period-crossing-evidence
          path: |
            outputs/p7-cogging-report/
            outputs/p7-winding-heat/
            outputs/p7-stator-thermal/
            outputs/p7-stator-rom/
            outputs/p7-electric-thermal-replay/
            outputs/p7-stator-fast-rom/
            outputs/p7-temperature-feedback/
            outputs/p7-feedback-endurance/
            outputs/p7-foc-loss-map/
            outputs/p7-speed-loss-map/
          if-no-files-found: error
