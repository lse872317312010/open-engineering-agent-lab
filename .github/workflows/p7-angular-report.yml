name: P7 loaded angular evidence and model support
on:
  push:
    branches: [codex/p7-loaded-angular]
    paths: ['benchmarks/p7_angular_evaluate.py', 'benchmarks/p7_angular_report.py', 'reports/p7-angular.html', '.github/workflows/p7-angular-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      LOADED_COMMIT: 26e7035e77252d11102599cd4016da30ff47dcd8
      LOADED_RUN: "41805176730"
      ANGULAR_COMMIT: 4b342ccedb419b464839d8c7838fab8452215f5b
      ANGULAR_RUN: "41983733579"
    steps:
      - name: Require completed native evidence before downloading archives
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const result = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: 41983733579
              });
              if (result.data.status === 'completed') {
                if (result.data.conclusion !== 'success') {
                  throw new Error('Native evidence run did not pass');
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Native evidence still incomplete after bounded wait');
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy==2.2.6 matplotlib==3.10.7 playwright==1.55.0
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: loaded-*
          path: outputs/loaded
          run-id: 41805176730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: angular-*
          path: outputs/angular
          run-id: 41983733579
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p7-local-flux-report
          path: outputs/frozen-model
          run-id: 41947340580
          github-token: ${{ github.token }}
      - run: |
          ruff check .
          python -m pytest
      - run: python benchmarks/p7_loaded_report.py
      - run: python benchmarks/p7_angular_evaluate.py
      - run: python benchmarks/p7_angular_report.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-angular-report
          path: outputs/p7-angular-report/
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        run: python -c "import json; from pathlib import Path; p=Path('outputs/p7-angular-report'); assert json.loads((p/'validation.json').read_text())['evidence_passed']; assert json.loads((p/'ui-validation.json').read_text())['passed']"
