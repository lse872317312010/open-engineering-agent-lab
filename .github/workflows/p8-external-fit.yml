name: P8 external magnetic fit smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/p8_fit_external.py"
      - "tests/test_p8_external_fit_inputs.py"
      - ".github/workflows/p8-external-fit.yml"

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aalto-Electric-Drives/motulator-gradnet
          ref: 940d3b2daf3abd3ecca157f93cf4cc5363f5bb80
          path: upstream-gradnet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install upstream
        run: |
          test "$(git -C upstream-gradnet rev-parse HEAD)" = 940d3b2daf3abd3ecca157f93cf4cc5363f5bb80
          test "$(git hash-object upstream-gradnet/examples/datasets/baldor_meas.npz)" = 13205be7fd92362f6a3ed0178f7c1652f942fd64
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "motulator==0.25.0" ./upstream-gradnet
      - name: Prepare fixed example and run entry
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/p8-external-input
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          out = Path("outputs/p8-external-input")
          with np.load("upstream-gradnet/examples/datasets/baldor_meas.npz", allow_pickle=False) as d:
              i = d["i_s_dq"].flatten()
              psi = d["psi_s_dq"].flatten()
          validation = np.isclose(np.abs(i.imag), 6.0, atol=1e-6, rtol=0)
          np.savez_compressed(out / "train.npz", i_s_dq=i[~validation], psi_s_dq=psi[~validation])
          np.savez_compressed(out / "validation.npz", i_s_dq=i[validation], psi_s_dq=psi[validation])
          nominal = {"pole_pairs": 2, "voltage_v": 460, "current_a": 8.8,
                     "frequency_hz": 60, "power_w": 5600, "torque_nm": 29.7}
          (out / "nominal.json").write_text(json.dumps(nominal), encoding="utf-8")
          PY
          python -m pip freeze > outputs/p8-external-input/versions.txt
          python benchmarks/p8_fit_external.py --train outputs/p8-external-input/train.npz \
            --validation outputs/p8-external-input/validation.npz \
            --nominal outputs/p8-external-input/nominal.json --epochs 20 \
            --output outputs/p8-external-fit 2>&1 | tee outputs/p8-external-input/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-external-fit-smoke
          path: |
            outputs/p8-external-input/
            outputs/p8-external-fit/
          if-no-files-found: warn
