name: OpenModelica model exchange evidence
on:
  push:
    branches: [main, codex/openmodelica-interop]
    paths: ['models/modelica/**', 'benchmarks/*openmodelica*', 'reports/openmodelica.html', 'tests/test_openmodelica*', '.github/workflows/openmodelica-interop.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed host and independent reference environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Export real ModelExchange using a resolved compiler digest
        run: python benchmarks/build_openmodelica.py
      - name: Lint and deterministic regression
        run: |
          ruff check .
          python -m pytest
      - name: Three implementations and independent energy audit
        run: python benchmarks/validate_openmodelica.py
      - name: Offline report and Chrome interaction
        run: python benchmarks/build_openmodelica_report.py
      - name: Retain environment and evidence hashes
        if: always()
        run: |
          mkdir -p outputs/openmodelica
          python -m pip freeze > outputs/openmodelica/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          files = {}
          for folder in ("openmodelica", "openmodelica-report", "joint-fmi"):
              for p in sorted((root / folder).rglob("*")):
                  if p.is_file() and not any(x in p.parts for x in ("runtime", "package")):
                      files[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          (root / "openmodelica/manifest.json").write_text(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmodelica-report
          path: outputs/openmodelica-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmodelica-raw-evidence
          path: |
            outputs/openmodelica/
            outputs/joint-fmi/
          if-no-files-found: error
      - name: Enforce frozen physics and UI gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("outputs/openmodelica/validation.json").read_text())["passed"]
          assert json.loads(Path("outputs/openmodelica-report/ui-validation.json").read_text())["passed"]
          PY
  tidy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the merged interop branch with a lease
        run: |
          python - <<'PY'
          import subprocess
          ref = "refs/heads/codex/openmodelica-interop"
          found = subprocess.check_output(["git", "ls-remote", "--heads", "origin", ref], text=True).strip()
          if found:
              sha = found.split()[0]
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha, "origin", ":" + ref], check=True)
          PY
