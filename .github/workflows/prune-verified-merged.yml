name: Finish verified branch cleanup
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/prune-verified-merged.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  finish:
    if: github.event.pull_request.number == 65 && github.event.pull_request.head.ref == 'codex/verified-branch-cleanup-20261106'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged follow-up and temporary cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLEANUP_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["GH_REPO"]
          def api(path, method="GET"):
              p = subprocess.run(["gh", "api", "--method", method, path],
                                 capture_output=True, text=True)
              if p.returncode:
                  raise RuntimeError(f"{method} {path}: {p.stderr.strip()}")
              return json.loads(p.stdout) if p.stdout else None
          follow = "codex/p7-thermal-evidence-followup"
          expected = "e93e56552ef0f82978e2114324191ce066a55de9"
          if api(f"repos/{repo}/git/ref/heads/{follow}")["object"]["sha"] != expected:
              raise RuntimeError("follow-up branch changed")
          base = api(f"repos/{repo}/git/ref/heads/codex/p7-period-crossing")["object"]["sha"]
          comparison = api(f"repos/{repo}/compare/{base}...{expected}")
          if comparison["ahead_by"] != 0:
              raise RuntimeError("follow-up not contained in active P7 branch")
          pulls = api(f"repos/{repo}/pulls?state=open&per_page=100")
          if any(follow in (p["head"]["ref"], p["base"]["ref"]) for p in pulls):
              raise RuntimeError("follow-up still used by an open PR")
          api(f"repos/{repo}/git/refs/heads/{follow}", "DELETE")
          print("deleted merged thermal follow-up", flush=True)
          cleanup = "codex/verified-branch-cleanup-20261106"
          if api(f"repos/{repo}/git/ref/heads/{cleanup}")["object"]["sha"] != os.environ["CLEANUP_HEAD"]:
              raise RuntimeError("cleanup branch changed")
          api(f"repos/{repo}/git/refs/heads/{cleanup}", "DELETE")
          print("deleted temporary cleanup branch", flush=True)
          PY
