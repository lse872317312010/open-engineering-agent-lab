name: Configured MSL cooling and one-second actual-drive evidence
on:
  push:
    branches: [main, codex/msl-configured-drive]
    paths: ['benchmarks/*msl_cooling_drive*', 'benchmarks/*msl_configured_drive*', 'benchmarks/*msl_cooling_configuration*', 'reports/msl-configured-drive.html', 'tests/test_msl_cooling_configuration*', '.github/workflows/msl-configured-drive.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
concurrency:
  group: msl-configured-drive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coupling:
    if: ${{ !contains(github.event.head_commit.message, '[report-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c4499fb66cfed99d289de9f7f36f895b319c5c62
          path: outputs/msl-drive-base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed host and independent reference environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip install "motulator @ git+https://github.com/Aalto-Electric-Drives/motulator.git@2ffbf1ae52d5fadcdffd85d10c80dd15fd2e39fa"
      - name: Lint and deterministic regression
        run: |
          ruff check .
          python -m pytest
      - name: Export pinned MSL Convection and BodyRadiation
        run: python benchmarks/build_msl_cooling.py
      - name: Preserve original seven hot-start coupling cases and report
        run: |
          python benchmarks/validate_msl_cooling_drive.py
          python benchmarks/build_msl_cooling_drive_report.py
      - name: Configured ambient, nonuniform initial state and one-second cold start
        run: python benchmarks/validate_msl_configured_drive.py
      - name: Five charts and actual Chrome configuration-state verification
        run: python benchmarks/build_msl_configured_drive_report.py
      - name: Retain environment and full evidence manifest
        if: always()
        run: |
          mkdir -p outputs/msl-configured-drive
          python -m pip freeze > outputs/msl-configured-drive/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          files = {}
          for folder in ("msl-cooling", "msl-cooling-drive", "msl-cooling-drive-report",
                         "msl-configured-drive", "msl-configured-drive-report"):
              for p in sorted((root / folder).rglob("*")):
                  if p.is_file() and not any(x in p.parts for x in ("runtime", "package")):
                      files[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          (root / "msl-configured-drive/manifest.json").write_text(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-configured-drive-report
          path: outputs/msl-configured-drive-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-configured-drive-raw-evidence
          path: |
            outputs/msl-cooling/
            outputs/msl-cooling-drive/
            outputs/msl-cooling-drive-report/
            outputs/msl-configured-drive/
          if-no-files-found: error
      - name: Enforce frozen configured physics and both report gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("msl-cooling-drive", "msl-configured-drive"):
              assert json.loads(Path("outputs", name, "validation.json").read_text())["passed"]
              assert json.loads(Path("outputs", name+"-report", "ui-validation.json").read_text())["passed"]
          PY
  report:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[report-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: msl-configured-drive-raw-evidence
          run-id: 40613204776
          github-token: ${{ github.token }}
          path: outputs
      - name: Install fixed report and regression environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip install "motulator @ git+https://github.com/Aalto-Electric-Drives/motulator.git@2ffbf1ae52d5fadcdffd85d10c80dd15fd2e39fa"
      - name: Lint and regression
        run: |
          ruff check .
          python -m pytest
      - name: Verify frozen sources, full raw manifest and both Chrome reports
        run: python benchmarks/recover_msl_configured_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-configured-drive-report
          path: outputs/msl-configured-drive-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-configured-legacy-report
          path: outputs/msl-cooling-drive-report/
          if-no-files-found: warn
      - name: Enforce source-bound science and final report gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("outputs/msl-configured-drive-report")
          assert json.loads((out / "recovery-provenance.json").read_text())["passed"]
          assert json.loads((out / "ui-validation.json").read_text())["passed"]
          PY
  tidy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the merged configured-drive branch with a lease
        run: |
          python - <<'PY'
          import subprocess
          ref = "refs/heads/codex/msl-configured-drive"
          found = subprocess.check_output(["git", "ls-remote", "--heads", "origin", ref], text=True).strip()
          if found:
              sha = found.split()[0]
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha, "origin", ":" + ref], check=True)
          PY
