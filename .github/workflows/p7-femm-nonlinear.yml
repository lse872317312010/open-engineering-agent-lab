        with:
          name: p7-nl-frozen-training
          path: outputs/p7-femm-nonlinear/
      - uses: actions/download-artifact@v4
        with:
          pattern: p7-nl-validated-*
          merge-multiple: true
          path: outputs/p7-femm-nonlinear/
      - name: Recheck complete native evidence and all original physics gates
        run: python benchmarks/p7_femm_nonlinear_batch.py assemble
      - name: Offline report and complete browser checks
        if: ${{ !cancelled() }}
        run: python benchmarks/build_p7_femm_nonlinear_report.py
      - name: Archive worker identity
        if: ${{ !cancelled() }}
        run: python benchmarks/p7_femm_nonlinear_batch.py archive report
      - name: Complete artifact manifest
        if: ${{ !cancelled() }}
        run: |
          python -c "import hashlib,json; from pathlib import Path; root=Path('outputs'); files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for name in ('p7-femm-nonlinear','p7-femm-nonlinear-report') for p in (root/name).rglob('*') if p.is_file() and p.name!='manifest.json'}; native=[p for p in files if p.endswith(('.fem','.ans'))]; assert len(native)==184; (root/'p7-femm-nonlinear/manifest.json').write_text(json.dumps(files,indent=2)); print('p7-nonlinear-native-verified:',len(files),'files,',len(native),'native models/solutions')"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-femm-nonlinear-report
          path: outputs/p7-femm-nonlinear-report/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-femm-nonlinear-raw-evidence
          path: outputs/p7-femm-nonlinear/
          if-no-files-found: error
      - name: Enforce all numerical and UI gates
        if: ${{ !cancelled() }}
        run: |
          python -c "import json; from pathlib import Path; root=Path('outputs'); assert all(json.loads((root/p).read_text())['passed'] for p in ('p7-femm-nonlinear/material-validation.json','p7-femm-nonlinear/validation.json','p7-femm-nonlinear-report/ui-validation.json'))"
