name: P7 loaded mesh evidence and sensitivity
on:
  push:
    branches: [codex/p7-loaded-mesh]
    paths: ['benchmarks/p7_loaded_mesh_evaluate.py', 'benchmarks/p7_loaded_mesh_report.py', 'benchmarks/p7_loaded_mesh_reference.py', 'benchmarks/p7_loaded_mesh_audit_negative.py', 'reports/p7-loaded-mesh.html', '.github/workflows/p7-loaded-mesh-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      LOADED_COMMIT: 26e7035e77252d11102599cd4016da30ff47dcd8
      LOADED_RUN: "41805176730"
      ANGULAR_COMMIT: 4b342ccedb419b464839d8c7838fab8452215f5b
      ANGULAR_RUN: "41983733579"
      CURRENT_COMMIT: 9b9482284ff18664abb1537ba050debb0ee556b0
      CURRENT_RUN: "41991447793"
      MESH_COMMIT: e5e31cd3adc265a8299d9ce4063d60c06dd58ffa
      MESH_RUN: "41995376711"
    steps:
      - name: Require completed native evidence before downloading archives
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 240; attempt++) {
              const result = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: 41995376711
              });
              if (result.data.status === 'completed') {
                if (result.data.conclusion !== 'success') {
                  throw new Error('Native evidence run did not pass');
                }
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Native evidence still incomplete after bounded wait');
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy==2.2.6 matplotlib==3.10.7 playwright==1.55.0
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: loaded-*
          path: outputs/loaded
          run-id: 41805176730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: angular-*
          path: outputs/angular
          run-id: 41983733579
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p7-local-flux-report
          path: outputs/frozen-model
          run-id: 41947340580
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: current-holdout-*
          path: outputs/current
          run-id: 41991447793
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: loaded-mesh-*
          path: outputs/mesh
          run-id: 41995376711
          github-token: ${{ github.token }}
      - run: |
          git fetch origin 18f6c0558994ddf19ca4e1257a427698932d9c9e --depth=1
          git diff --exit-code 18f6c0558994ddf19ca4e1257a427698932d9c9e HEAD -- benchmarks/p7_current_evaluate.py
          git fetch origin bcbb581348d394db91b87b895c7822a35534d287 --depth=1
          git diff --exit-code bcbb581348d394db91b87b895c7822a35534d287 HEAD -- benchmarks/p7_angular_evaluate.py benchmarks/p7_loaded_report.py benchmarks/p7_angular_reference.py benchmarks/p7_local_flux_model.py
          ruff check .
          python -m pytest
      - run: python benchmarks/p7_loaded_report.py
      - run: python benchmarks/p7_angular_evaluate.py
      - run: python benchmarks/p7_current_evaluate.py
      - run: python benchmarks/p7_loaded_mesh_evaluate.py
      - run: python benchmarks/p7_loaded_mesh_audit_negative.py
      - run: python benchmarks/p7_loaded_mesh_report.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-loaded-mesh-report
          path: outputs/p7-loaded-mesh-report/
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        run: python -c "import json; from pathlib import Path; p=Path('outputs/p7-loaded-mesh-report'); assert json.loads((p/'validation.json').read_text())['evidence_passed']; assert json.loads((p/'ui-validation.json').read_text())['passed']"
