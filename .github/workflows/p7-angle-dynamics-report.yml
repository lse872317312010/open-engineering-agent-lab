name: P7 loaded angle refinement and energy interface
on:
  push:
    branches: [codex/p7-loaded-angle-dynamics]
    paths: ['benchmarks/p7_loaded_angle_evaluate.py', 'benchmarks/p7_midpoint_mesh_evaluate.py', 'benchmarks/p7_midpoint_mesh_audit_negative.py', 'benchmarks/p7_angle_flux.py', 'benchmarks/p7_angle_current_loop.py', 'benchmarks/p7_angle_dynamics_simulation.py', 'benchmarks/p7_angle_dynamics_report.py', 'benchmarks/p7_loaded_angle_audit_negative.py', 'reports/p7-angle-dynamics.html', '.github/workflows/p7-angle-dynamics-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      LOADED_COMMIT: 26e7035e77252d11102599cd4016da30ff47dcd8
      LOADED_RUN: "41805176730"
      ANGULAR_COMMIT: 4b342ccedb419b464839d8c7838fab8452215f5b
      ANGULAR_RUN: "41983733579"
      CURRENT_COMMIT: 9b9482284ff18664abb1537ba050debb0ee556b0
      CURRENT_RUN: "41991447793"
      REFINE_COMMIT: 4c3a076c5e0749c91fdabd6bcb7e9b24abba9d1d
      REFINE_RUN: "41998773413"
      MID_COMMIT: 939095258644b5f785885b7b08cd34be756239dd
      MID_RUN: "42000844037"
    steps:
      - name: Require completed native evidence before downloading archives
        uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [41998773413, 42000844037]) {
              let done = false;
              for (let attempt = 0; attempt < 180; attempt++) {
                const result = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id
                });
                if (result.data.status === 'completed') {
                  if (result.data.conclusion !== 'success') {
                    throw new Error('Native evidence run '+run_id+' did not pass');
                  }
                  done = true;
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (!done) throw new Error('Native evidence still incomplete: '+run_id);
            }
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.7 playwright==1.55.0
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: loaded-*
          path: outputs/loaded
          run-id: 41805176730
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: angular-*
          path: outputs/angular
          run-id: 41983733579
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p7-local-flux-report
          path: outputs/frozen-model
          run-id: 41947340580
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: current-holdout-*
          path: outputs/current
          run-id: 41991447793
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: loaded-angle-*
          path: outputs/refine
          run-id: 41998773413
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: midpoint-mesh-*
          path: outputs/midpoint
          run-id: 42000844037
          github-token: ${{ github.token }}
      - run: |
          git fetch origin d5075efdc60ef0e495fb2239d64bc4a005634242 --depth=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code d5075efdc60ef0e495fb2239d64bc4a005634242 HEAD -- benchmarks/p7_current_evaluate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin f8cfb936deb271ece2908bb8ab4781ba2270ce5b --depth=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code f8cfb936deb271ece2908bb8ab4781ba2270ce5b HEAD -- src/oeal/current_control.py src/oeal/foc.py src/oeal/transforms.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin bcbb581348d394db91b87b895c7822a35534d287 --depth=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code bcbb581348d394db91b87b895c7822a35534d287 HEAD -- benchmarks/p7_angular_evaluate.py benchmarks/p7_loaded_report.py benchmarks/p7_angular_reference.py benchmarks/p7_local_flux_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest
      - run: python benchmarks/p7_loaded_report.py
      - run: python benchmarks/p7_angular_evaluate.py
      - run: python benchmarks/p7_current_evaluate.py
      - run: python benchmarks/p7_loaded_angle_evaluate.py
      - run: python benchmarks/p7_loaded_angle_audit_negative.py
      - run: python benchmarks/p7_midpoint_mesh_evaluate.py
      - run: python benchmarks/p7_midpoint_mesh_audit_negative.py
      - run: python benchmarks/p7_angle_dynamics_simulation.py
      - run: python benchmarks/p7_angle_current_loop.py
      - run: python benchmarks/p7_angle_dynamics_report.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-angle-dynamics
          path: outputs/p7-angle-dynamics/
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        run: python -c "import json; from pathlib import Path; p=Path('outputs/p7-angle-dynamics'); assert json.loads((p/'fields.json').read_text())['evidence_passed']; assert json.loads((p/'ui-validation.json').read_text())['passed']"
