name: Continuous drive and MSL thermal feedback evidence
on:
  push:
    branches: [main, codex/msl-drive]
    paths: ['src/oeal/backends/energy.py', 'src/oeal/backends/motulator.py', 'benchmarks/*msl_drive*', 'reports/msl-drive.html', 'tests/test_thermal_provider.py', 'tests/test_msl_drive*', '.github/workflows/msl-drive.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
concurrency:
  group: msl-drive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  thermal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 65acdc66d3ccdcdfcee933c3e82b67c2a549cad4
          path: outputs/msl-drive-base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed host and independent reference environment
        run: |
          python -m pip install -r benchmarks/p6-requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip install "motulator @ git+https://github.com/Aalto-Electric-Drives/motulator.git@2ffbf1ae52d5fadcdffd85d10c80dd15fd2e39fa"
      - name: Export actual MSL components using pinned library and compiler
        run: python benchmarks/build_msl_thermal.py
      - name: Lint and deterministic regression
        run: |
          ruff check .
          python -m pytest
      - name: Actual losses continuous MSL feedback and complete RHS audit
        run: python benchmarks/validate_msl_drive.py
      - name: Offline report and Chrome interaction
        run: python benchmarks/build_msl_drive_report.py
      - name: Retain environment and evidence hashes
        if: always()
        run: |
          mkdir -p outputs/msl-drive
          python -m pip freeze > outputs/msl-drive/environment.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("outputs")
          files = {}
          for folder in ("msl-thermal", "msl-drive", "msl-drive-report"):
              for p in sorted((root / folder).rglob("*")):
                  if p.is_file() and not any(x in p.parts for x in ("runtime", "package")):
                      files[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          (root / "msl-drive/manifest.json").write_text(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-drive-report
          path: outputs/msl-drive-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msl-drive-raw-evidence
          path: |
            outputs/msl-drive/
            outputs/msl-thermal/
          if-no-files-found: error
      - name: Enforce frozen physics and UI gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("outputs/msl-drive/validation.json").read_text())["passed"]
          assert json.loads(Path("outputs/msl-drive-report/ui-validation.json").read_text())["passed"]
          PY
  tidy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the merged drive feedback branch with a lease
        run: |
          python - <<'PY'
          import subprocess
          ref = "refs/heads/codex/msl-drive"
          found = subprocess.check_output(["git", "ls-remote", "--heads", "origin", ref], text=True).strip()
          if found:
              sha = found.split()[0]
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha, "origin", ":" + ref], check=True)
          PY
