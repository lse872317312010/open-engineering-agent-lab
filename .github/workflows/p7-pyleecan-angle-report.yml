name: P7 angle report from verified native evidence
on:
  push:
    branches: [main, codex/p7-pyleecan-angle]
    paths: ['benchmarks/p7_angle_aggregate.py', 'benchmarks/p7_angle_reference.py', 'benchmarks/p7_angle_report.py', 'benchmarks/p7_angle_reuse.py', 'reports/p7-pyleecan-angle.html', '.github/workflows/p7-pyleecan-angle-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: angle-report-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      ANGLE_SOURCE_COMMIT: 73d470a58c9f8d63991c3d5ae7cd9390cf62dd50
      ANGLE_SOURCE_RUN: "41601354282"
      ANGLE_FINE_COMMIT: a57beef900ae3dbc5e5724f37236896c529c2bcb
      ANGLE_FINE_RUN: "41602596148"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed scientific and browser dependencies
        run: |
          python -m pip install numpy==2.2.6 matplotlib==3.10.7 playwright==1.55.0
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: angle-lane-0
          path: outputs/angle-lanes/angle-lane-0
          run-id: 41601354282
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: angle-lane-1
          path: outputs/angle-lanes/angle-lane-1
          run-id: 41601354282
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: angle-lane-2-retry
          path: outputs/angle-lanes/angle-lane-2
          run-id: 41602596148
          github-token: ${{ github.token }}
      - name: Verify archive and numerical producer identity
        run: python benchmarks/p7_angle_reuse.py
      - name: Ruff and tests
        run: |
          ruff check .
          python -m pytest
      - name: Re-evaluate original physical gates
        run: python benchmarks/p7_angle_aggregate.py
      - name: Build report and run browser acceptance
        run: python benchmarks/p7_angle_report.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: p7-angle-interactive-report
          path: outputs/p7-angle-report/
          if-no-files-found: error
      - name: Require native identity and complete acceptance
        if: ${{ !cancelled() }}
        run: |
          python -c "import json; from pathlib import Path; p=Path('outputs/p7-angle-report'); assert json.loads((p/'reuse-proof.json').read_text())['passed']; assert json.loads((p/'angle-data.json').read_text())['passed']; assert json.loads((p/'ui-validation.json').read_text())['passed']"
