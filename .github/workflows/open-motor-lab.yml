name: Open motor model upstream integration
on:
  pull_request:
    paths:
      - 'benchmarks/open_motor_lab.py'
      - 'benchmarks/assets/open-motor-thor.json'
      - 'docs/open-motor-model*.md'
      - '.github/workflows/open-motor-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install motulator==0.25.0 optuna==4.5.0 'matplotlib>=3.10,<4' 'numpy<3' 'ruff>=0.6,<1'
      - run: ruff check benchmarks/open_motor_lab.py
      - name: Fetch pinned upstream source and sample flux map
        run: |
          git clone --filter=blob:none https://github.com/Aalto-Electric-Drives/motulator.git "$RUNNER_TEMP/motulator"
          git -C "$RUNNER_TEMP/motulator" checkout 9971fcb77a08cc8d1f1603554a047ff5a59291e9
          test "$(git -C "$RUNNER_TEMP/motulator" rev-parse HEAD)" = 9971fcb77a08cc8d1f1603554a047ff5a59291e9
          test "$(git -C "$RUNNER_TEMP/motulator" hash-object examples/drive/data/thor.mat)" = f31ccbc2ab8d987a0e7d6d8a86611a66bc9dece5
      - name: Run imported map and upstream control study
        run: python benchmarks/open_motor_lab.py --map "$RUNNER_TEMP/motulator/examples/drive/data/thor.mat" --config benchmarks/assets/open-motor-thor.json --output outputs/open-motor-lab
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: open-motor-lab-evidence
          path: outputs/open-motor-lab/
          if-no-files-found: error
